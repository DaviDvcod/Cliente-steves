<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF7A1A">
<title>STEVEFLASH</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f5f4f2;--card:#fff;--tx:#1b1f23;--mut:#6b737b;--acc:#ff7a1a;--ok:#22a861;--bad:#e5484d;--bd:#e6e3df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:1000;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;border-bottom:1px solid var(--bd)}
header b{font-size:22px;letter-spacing:-.02em}
header b span{color:var(--acc)}
main{max-width:520px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.k{color:var(--mut);font-size:13px}
.val{font-size:22px;font-weight:800;color:var(--acc)}
.sec{font-weight:700;font-size:18px;margin:16px 2px 10px}
input{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:#fff;color:var(--tx);font:inherit;outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label.lbl{font-size:14px;font-weight:600;color:var(--mut);display:block;margin:2px 0 8px}
.btn{border:0;background:var(--acc);color:#fff;min-height:50px;padding:12px 20px;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn.sm{width:auto;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:5px 11px;border-radius:9px}
.pill.ok{background:#e3f6ec;color:var(--ok)}
.pill.warn{background:#fff1e0;color:#c76a0a}
.pill.bad{background:#fde8e8;color:var(--bad)}
/* MAPA */
#mapWrap{position:relative;margin:12px 0 10px}
#map{height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--bd);z-index:0;background:#e8e6e2}
#map.dk .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
#mapWrap.full{position:fixed;inset:0;z-index:1500;margin:0}
#mapWrap.full #map{height:100%;border-radius:0;border:0}
.mb{position:absolute;right:10px;z-index:1000;width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--tx);font-size:19px;cursor:pointer;box-shadow:0 2px 8px #0003;padding:0}
#mapWrap.full .mb{margin-top:env(safe-area-inset-top,0px)}
#bFull{top:10px}#bLay{top:62px}#bCen{top:114px}#bCen.on{color:var(--acc);border-color:var(--acc)}
#mInfo{position:absolute;left:10px;right:64px;bottom:10px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font-size:13px;display:none;box-shadow:0 2px 8px #0003}
#mapWrap.full #mInfo{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
#mInfo b{color:var(--acc);font-size:15px}
.empty{color:var(--mut);text-align:center;padding:28px 10px}
#sug{position:absolute;left:0;right:0;top:100%;z-index:1200;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.18);margin-top:6px;overflow:hidden;display:none}
.sg{padding:12px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.sg:last-child{border:0}.sg:active{background:#fff1e0}
.sg b{display:block;font-size:15px}.sg span{font-size:12.5px;color:var(--mut)}
.me{width:18px;height:18px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 2px rgba(47,124,246,.3),0 1px 4px rgba(0,0,0,.4)}
.mo{width:34px;height:34px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 7px rgba(255,122,26,.25),0 2px 8px #0008;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;transition:transform .4s}
.em{font-size:26px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
a.wa{color:var(--ok);text-decoration:none;font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:2000;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<header><b>🛵 STEVE<span>FLASH</span></b></header>
<main id="app"></main>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
<script>
"use strict";
const SB="https://bkjywijgogeyekwgqawq.supabase.co",KEY="sb_publishable_v8SlYZngr9uQ0vpBxlPDPg_GBKN_-Or";
const $=id=>document.getElementById(id);
const LS=k=>localStorage.getItem(k);
const brl=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tT=null;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2800)}
async function api(path,opt={}){
  const r=await fetch(SB+"/rest/v1/"+path,{...opt,headers:{apikey:KEY,...(KEY.startsWith("eyJ")?{Authorization:"Bearer "+KEY}:{}),"Content-Type":"application/json",Prefer:opt.prefer||"return=representation",...(opt.headers||{})}});
  if(!r.ok)throw new Error("erro "+r.status+": "+(await r.text()).slice(0,160));
  return (r.headers.get("content-type")||"").includes("json")?r.json():null;
}
const hav=(a,b,c,d)=>{const r=x=>x*Math.PI/180,p=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*6371*Math.asin(Math.sqrt(p))};
const brg=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b[1]-a[1]),y=Math.sin(dl)*Math.cos(r(b[0])),x=Math.cos(r(a[0]))*Math.sin(r(b[0]))-Math.sin(r(a[0]))*Math.cos(r(b[0]))*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360};
const soDig=t=>{const d=String(t||"").replace(/\D/g,"");return d.length<=11?"55"+d:d};

/* ====== MAPA AVANÇADO ====== */
const CAMADAS=[
  {n:"Ruas",gl:"https://tiles.openfreemap.org/styles/liberty"},
  {n:"Claro",gl:"https://tiles.openfreemap.org/styles/positron"},
  {n:"Escuro",gl:"https://tiles.openfreemap.org/styles/dark",dk:1},
  {n:"Satélite",u:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",z:18}
];
let ultima=[],reenviando=false,me={lat:-27.816,lng:-50.326},map=null,layers={},dest=null,rota=null,poller=null,anim=null;
let lay=+LS("cli_lay")||0,tile=null,tracking=false,follow=false,rmBusy=false,rmFrom=null;
const icoMe=L.divIcon({html:'<div class="me"></div>',className:"",iconSize:[18,18],iconAnchor:[9,9]});
const icoFlag=L.divIcon({html:'<div class="em">🏁</div>',className:"",iconSize:[30,30],iconAnchor:[6,28]});
const icoMoto=L.divIcon({html:'<div class="em">🏍️</div>',className:"",iconSize:[30,30],iconAnchor:[15,15]});
const icoArrow=L.divIcon({html:'<div class="mo">▲</div>',className:"",iconSize:[34,34],iconAnchor:[17,17]});
const mapHtml=()=>`<div id="mapWrap"><div id="map"></div><button class="mb" id="bFull" aria-label="Tela cheia">⤢</button><button class="mb" id="bLay" aria-label="Trocar mapa">🗺️</button><button class="mb" id="bCen" aria-label="Centralizar">🎯</button><div id="mInfo"></div></div>`;

function setLayer(i){
  lay=(i+CAMADAS.length)%CAMADAS.length;localStorage.setItem("cli_lay",lay);
  const c=CAMADAS[lay];let gl=false;
  if(tile)map.removeLayer(tile);
  tile=null;
  if(c.gl&&L.maplibreGL){try{tile=L.maplibreGL({style:c.gl,attribution:"© OpenFreeMap © OpenMapTiles Dados © OpenStreetMap"}).addTo(map);gl=true}catch(e){tile=null}}
  if(!tile)tile=L.tileLayer(c.u||"https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:c.z||19,maxNativeZoom:c.z||19,attribution:"© OpenStreetMap / Esri"}).addTo(map);
  if(tile.bringToBack)tile.bringToBack();
  $("map").classList.toggle("dk",!gl&&!!c.dk);
}
function initMap(){
  if(map){map.remove();map=null}
  layers={};rmFrom=null;follow=false;
  map=L.map("map",{zoomControl:false,zoomSnap:.5,minZoom:3,preferCanvas:true}).setView([me.lat,me.lng],14);
  map.attributionControl.setPrefix(false);
  setLayer(lay);
  L.control.scale({imperial:false,position:"bottomleft"}).addTo(map);
  layers.acc=L.circle([me.lat,me.lng],{radius:0,color:"#2f7cf6",weight:1,fillOpacity:.1,interactive:false}).addTo(map);
  layers.me=L.marker([me.lat,me.lng],{icon:icoMe}).addTo(map);
  layers.ms=L.layerGroup().addTo(map);
  map.on("dragstart",()=>{follow=false;$("bCen").classList.remove("on")});
  $("bLay").onclick=()=>{setLayer(lay+1);toast("Mapa: "+CAMADAS[lay].n)};
  $("bFull").onclick=()=>{
    const w=$("mapWrap"),f=w.classList.toggle("full");
    $("bFull").textContent=f?"✕":"⤢";document.body.style.overflow=f?"hidden":"";
    setTimeout(()=>map.invalidateSize(),60);
  };
  $("bCen").onclick=()=>{
    if(tracking&&layers.moto){follow=true;$("bCen").classList.add("on");map.setView(layers.moto.getLatLng(),16,{animate:true})}
    else map.setView([me.lat,me.lng],15,{animate:true});
  };
  if(!tracking)map.on("click",async e=>{
    const{lat,lng}=e.latlng;$("info").textContent="Buscando endereço…";
    let end="Local no mapa";
    try{const r=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=pt-BR&lat=${lat}&lon=${lng}`)).json();
      if(r&&r.display_name)end=r.display_name.split(",").slice(0,3).join(",").trim()}catch(e){}
    definirDestino(lat,lng,end);
  });
}
async function rotaReal(a,b){
  try{
    const r=await (await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`)).json();
    const t=r.routes[0];
    return{km:t.distance/1000,min:Math.max(1,Math.round(t.duration/60)),pts:t.geometry.coordinates.map(c=>[c[1],c[0]])};
  }catch(e){return{km:hav(a.lat,a.lng,b.lat,b.lng),min:0,pts:[[a.lat,a.lng],[b.lat,b.lng]]}}
}
function desenhar(){
  ["line","glow","flag"].forEach(k=>{if(layers[k]){map.removeLayer(layers[k]);delete layers[k]}});
  if(tracking)layers.line=L.polyline(rota.pts,{color:"#9aa3ab",weight:4,dashArray:"6 8",opacity:.85}).addTo(map);
  else{
    layers.glow=L.polyline(rota.pts,{color:"#ff7a1a",weight:12,opacity:.25,lineCap:"round"}).addTo(map);
    layers.line=L.polyline(rota.pts,{color:"#ff7a1a",weight:5,opacity:.95,lineCap:"round",lineJoin:"round"}).addTo(map);
  }
  layers.flag=L.marker([dest.lat,dest.lng],{icon:icoFlag}).addTo(map);
  map.fitBounds(layers.line.getBounds().extend([me.lat,me.lng]),{padding:[40,40]});
}
async function definirDestino(lat,lng,end){
  dest={lat,lng,end};fechaSug();salvaRecente(dest);
  $("info").textContent="Traçando rota…";
  rota=await rotaReal(me,dest);
  desenhar();
  $("info").innerHTML=`🛣️ ${rota.km.toFixed(1)} km de rota${rota.min?` · 🕐 ~${rota.min} min`:""} até ${esc(dest.end)}`;
  listar();
  if($("agora"))$("agora").disabled=false;
}
function mover(p){
  if(!layers.moto){layers.moto=L.marker(p,{icon:icoArrow,zIndexOffset:1000}).addTo(map);return}
  const a=layers.moto.getLatLng(),t0=performance.now(),el=layers.moto.getElement();
  if(el&&hav(a.lat,a.lng,p[0],p[1])>.005)el.firstChild.style.transform="rotate("+brg([a.lat,a.lng],p)+"deg)";
  if(follow)map.panTo(p,{animate:true,duration:1.2});
  cancelAnimationFrame(anim);
  const f=t=>{const k=Math.min(1,(t-t0)/1500);layers.moto.setLatLng([a.lat+(p[0]-a.lat)*k,a.lng+(p[1]-a.lng)*k]);if(k<1)anim=requestAnimationFrame(f)};
  anim=requestAnimationFrame(f);
}
async function rotaMoto(m){
  if(rmBusy||!dest)return;
  if(rmFrom&&hav(m.lat,m.lng,rmFrom[0],rmFrom[1])<.1)return;
  rmBusy=true;
  const r=await rotaReal({lat:+m.lat,lng:+m.lng},dest);
  rmBusy=false;
  if(!map)return;
  rmFrom=[+m.lat,+m.lng];
  if(layers.rm){layers.rm.setLatLngs(r.pts);layers.rmG.setLatLngs(r.pts)}
  else{
    layers.rmG=L.polyline(r.pts,{color:"#ff7a1a",weight:12,opacity:.25,lineCap:"round"}).addTo(map);
    layers.rm=L.polyline(r.pts,{color:"#ff7a1a",weight:5,opacity:.95,lineCap:"round",lineJoin:"round"}).addTo(map);
  }
  const i=$("mInfo");if(i){i.innerHTML=`<b>${r.km.toFixed(1)} km</b>${r.min?` · ~${r.min} min`:""} até o destino`;i.style.display="block"}
}
function limparRotaMoto(){
  ["rm","rmG"].forEach(k=>{if(layers[k]){map.removeLayer(layers[k]);delete layers[k]}});
  const i=$("mInfo");if(i)i.style.display="none";
}

/* ====== SUGESTÕES DE ENDEREÇO (autocompletar) ====== */
let sugT=null,sugSeq=0;
const RECENTES=()=>{try{return JSON.parse(LS("recentes")||"[]")}catch(e){return[]}};
function salvaRecente(d){
  const r=RECENTES().filter(x=>x.end!==d.end);r.unshift({end:d.end,lat:d.lat,lng:d.lng});
  localStorage.setItem("recentes",JSON.stringify(r.slice(0,5)));
}
function fechaSug(){const e=$("sug");if(e){e.style.display="none";e.innerHTML=""}}
function mostraSug(l,titulo){
  const e=$("sug");if(!e)return;
  if(!l.length){fechaSug();return}
  e.innerHTML=(titulo?'<div class="k" style="padding:10px 14px 2px">'+titulo+'</div>':"")+l.map((x,i)=>`<div class="sg" data-i="${i}"><b>📍 ${esc(x.t)}</b><span>${esc(x.s)}</span></div>`).join("");
  e.style.display="block";
  e.querySelectorAll(".sg").forEach(el=>el.onclick=()=>{const x=l[+el.dataset.i];$("q").value=x.t;fechaSug();definirDestino(x.lat,x.lng,x.end)});
}
function mostraRecentes(){
  mostraSug(RECENTES().map(x=>({t:x.end.split(",")[0],s:x.end.split(",").slice(1).join(",").trim(),lat:x.lat,lng:x.lng,end:x.end})),"🕘 Recentes");
}
async function sugerir(q){
  const my=++sugSeq;
  try{
    const r=await(await fetch("https://photon.komoot.io/api/?limit=10&location_bias_scale=0.6&lat="+me.lat+"&lon="+me.lng+"&q="+encodeURIComponent(q))).json();
    if(my!==sugSeq)return;
    const l=(r.features||[]).filter(f=>f.properties.countrycode==="BR").slice(0,5).map(f=>{
      const p=f.properties,num=p.housenumber?", "+p.housenumber:"";
      const t=p.name&&p.name!==p.street?p.name:(p.street?p.street+num:"Local");
      const s=[p.name&&p.street&&p.name!==p.street?p.street+num:"",p.district,p.city||p.county,p.state].filter(Boolean).join(", ");
      return{t,s,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],end:t+(s?", "+s:"")};
    });
    if(l.length)mostraSug(l);else fechaSug();
  }catch(e){if(my===sugSeq)fechaSug()}
}
document.addEventListener("click",e=>{if(!e.target.closest("#sug,#q"))fechaSug()});

function home(){
  clearInterval(poller);tracking=false;
  $("app").innerHTML=`
  <div class="card">
    <label class="lbl" for="q">Para onde vamos?</label>
    <div class="row" style="position:relative"><input id="q" placeholder="Endereço ou lugar" enterkeyhint="search" autocomplete="off"><button class="btn sm" id="go">Buscar</button><div id="sug"></div></div>
    ${mapHtml()}
    <div id="info" class="k">Digite o destino ou toque no mapa para escolher.</div>
  </div>
  <div class="card">
    <label class="lbl">Seus dados (o motoboy vê)</label>
    <div class="grid2"><input id="nome" placeholder="Seu nome" value="${esc(LS("cli_nome")||"")}"><input id="tel" type="tel" placeholder="WhatsApp" value="${esc(LS("cli_tel")||"")}"></div>
  </div>
  <button class="btn" id="agora" style="margin-bottom:12px" disabled>🚀 Pedir moto agora</button>
  <div class="sec">🏍️ Motoboys disponíveis</div>
  <div id="lista"><div class="empty">Procurando motoboys…</div></div>${histHtml()}`;
  dest=null;rota=null;
  initMap();
  $("go").onclick=buscar;
  $("agora").onclick=()=>{const m=ultima[0];if(!m){toast("Nenhum motoboy online agora");return}localStorage.setItem("auto","1");localStorage.setItem("tentados",JSON.stringify([String(m.id)]));chamar(m,$("agora"))};
  $("q").onkeydown=e=>{if(e.key==="Enter")buscar()};
  $("q").oninput=e=>{
    clearTimeout(sugT);const q=e.target.value.trim();
    if(q.length<3){sugSeq++;q?fechaSug():mostraRecentes();return}
    sugT=setTimeout(()=>sugerir(q),350);
  };
  $("q").onfocus=()=>{if(!$("q").value.trim())mostraRecentes()};
  listar();
  poller=setInterval(listar,8000);
}

async function buscar(){
  const q=$("q").value.trim();if(!q)return;
  fechaSug();sugSeq++;clearTimeout(sugT);
  $("go").disabled=true;$("info").textContent="Buscando…";
  try{
    const vb=[me.lng-.5,me.lat+.5,me.lng+.5,me.lat-.5].join(",");
    const r=await (await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&accept-language=pt-BR&viewbox="+vb+"&q="+encodeURIComponent(q))).json();
    if(!r.length){$("info").textContent="Endereço não encontrado. Tente incluir a cidade.";return}
    await definirDestino(+r[0].lat,+r[0].lon,r[0].display_name.split(",").slice(0,3).join(",").trim());
  }catch(e){$("info").textContent="Não foi possível buscar agora. Tente de novo."}
  finally{$("go").disabled=false}
}

async function listar(){
  const box=$("lista");if(!box)return;
  let l=[];
  try{l=await api("motoboys?online=eq.true&select=*")}catch(e){box.innerHTML='<div class="empty">Sem conexão. Verifique a internet.</div>';return}
  const lim=Date.now()-10*60000;
  l=l.filter(m=>m.lat!=null&&m.lng!=null&&(!m.atualizado_em||new Date(m.atualizado_em).getTime()>lim));
  l.forEach(m=>m.d=hav(me.lat,me.lng,m.lat,m.lng));
  l.sort((a,b)=>a.d-b.d);ultima=l;
  if(map&&layers.ms){
    layers.ms.clearLayers();
    l.forEach(m=>L.marker([+m.lat,+m.lng],{icon:icoMoto}).bindTooltip(esc(m.nome)+" · "+brl(m.preco_km)+"/km",{direction:"top",offset:[0,-14]}).addTo(layers.ms));
  }
  if(!l.length){box.innerHTML='<div class="empty">Nenhum motoboy online no momento.</div>';return}
  box.innerHTML=l.map(m=>`<div class="card">
    <div class="row"><div><b>${esc(m.nome)}</b><div class="k">a ${m.d.toFixed(1)} km de você · ${brl(m.preco_km)}/km</div></div><div class="val">${rota?brl(rota.km*m.preco_km):""}</div></div>
    <button class="btn" style="margin-top:12px" data-m="${esc(m.id)}" ${rota?"":"disabled"}>${rota?"Chamar":"Escolha um destino"}</button></div>`).join("");
  box.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{localStorage.setItem("auto","0");chamar(l.find(m=>String(m.id)===b.dataset.m),b)});
}

async function chamar(m,btn){
  const nome=$("nome").value.trim(),tel=$("tel").value.trim();
  if(!nome){toast("Informe seu nome");$("nome").focus();return}
  localStorage.setItem("cli_nome",nome);localStorage.setItem("cli_tel",tel);
  btn.disabled=true;btn.textContent="Chamando…";
  try{
    const r=await api("corridas",{method:"POST",body:JSON.stringify({motoboy_id:m.id,cliente_nome:nome,cliente_tel:tel,destino_end:dest.end,destino_lat:dest.lat,destino_lng:dest.lng,distancia_km:+rota.km.toFixed(2),valor:+(rota.km*m.preco_km).toFixed(2),status:"pendente"})});
    localStorage.setItem("corrida_id",r[0].id);
    acompanhar();
  }catch(e){toast("Erro: "+e.message);btn.disabled=false;btn.textContent="Chamar"}
}

const ST={pendente:["⏳ Aguardando o motoboy aceitar","warn"],aceita:["✅ Motoboy aceitou","ok"],a_caminho:["🏍️ Motoboy a caminho","ok"],concluida:["🏁 Corrida concluída","ok"],recusada:["✖ O motoboy recusou","bad"],cancelada:["Corrida cancelada","bad"]};
function acompanhar(){
  clearInterval(poller);tracking=true;
  const id=LS("corrida_id");if(!id){home();return}
  $("app").innerHTML=`<div class="card">
    <div class="row"><span class="pill" id="st">…</span><span class="val" id="vl"></span></div>
    ${mapHtml()}
    <div id="dt"></div><div id="ac" style="margin-top:12px"></div></div>`;
  initMap();
  let lastSt=null,fit=false;
  const tick=async()=>{
    let c,m=null;
    try{c=(await api("corridas?id=eq."+encodeURIComponent(id)+"&select=*"))[0]}catch(e){return}
    if(!c){localStorage.removeItem("corrida_id");home();return}
    if(!$("st"))return;
    if(LS("auto")==="1"&&(c.status==="recusada"||(c.status==="pendente"&&Date.now()-new Date(c.criado_em).getTime()>45000))){
      if(c.status==="pendente")api("corridas?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"cancelada",atualizado_em:new Date().toISOString()}),prefer:"return=minimal"}).catch(()=>{});
      reenviar(c);return;
    }
    if(!dest){
      dest={lat:+c.destino_lat,lng:+c.destino_lng,end:c.destino_end};
      rota=await rotaReal(me,dest);desenhar();
    }
    try{m=(await api("motoboys?id=eq."+encodeURIComponent(c.motoboy_id)+"&select=*"))[0]}catch(e){}
    const [txt,cls]=ST[c.status]||[c.status,"warn"];
    $("st").textContent=txt;$("st").className="pill "+cls;
    $("vl").textContent=brl(c.valor);
    const wa=m&&m.telefone?` · <a class="wa" target="_blank" rel="noopener" href="https://wa.me/${soDig(m.telefone)}">💬 Falar com o motoboy</a>`:"";
    $("dt").innerHTML=`<div class="k">📍 ${esc(c.destino_end||"")}</div><div class="k">${(+c.distancia_km).toFixed(1)} km${m?" · "+esc(m.nome):""}${wa}</div>`;
    if(m&&m.lat!=null&&m.lng!=null&&["aceita","a_caminho","pendente"].includes(c.status)){
      mover([+m.lat,+m.lng]);
      if(!fit){fit=true;map.fitBounds(L.latLngBounds([[me.lat,me.lng],[dest.lat,dest.lng],[+m.lat,+m.lng]]),{padding:[40,40]})}
      if(c.status!=="pendente")rotaMoto(m);
    }
    if(c.status!==lastSt){
      lastSt=c.status;
      const fim=["concluida","recusada","cancelada"].includes(c.status);
      if(fim)limparRotaMoto();
      $("ac").innerHTML=fim?(c.status==="concluida"&&!c.avaliacao?'<div style="text-align:center;font-weight:700;margin-bottom:6px">Como foi a corrida?</div><div id="stars" style="display:flex;justify-content:center;gap:6px;font-size:38px;margin-bottom:12px">'+[1,2,3,4,5].map(n=>'<span data-n="'+n+'" style="cursor:pointer;filter:grayscale(1);opacity:.5">⭐</span>').join("")+'</div>':"")+'<button class="btn" id="nova">Nova corrida</button>':'<button class="btn bad" id="canc">Cancelar pedido</button>';
      if(fim){clearInterval(poller);guardarHist(c);ligarEstrelas(id);$("nova").onclick=()=>{localStorage.removeItem("corrida_id");home()}}
      else $("canc").onclick=async()=>{
        $("canc").disabled=true;localStorage.setItem("auto","0");
        try{await api("corridas?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"cancelada",atualizado_em:new Date().toISOString()}),prefer:"return=minimal"});toast("Pedido cancelado");tick()}
        catch(e){toast("Erro: "+e.message);$("canc").disabled=false}
      };
    }
  };
  tick();
  poller=setInterval(tick,4000);
}

async function reenviar(c){
  if(reenviando)return;reenviando=true;
  try{
    const t=JSON.parse(LS("tentados")||"[]"),lim=Date.now()-10*60000;
    let l=await api("motoboys?online=eq.true&select=*");
    l=l.filter(m=>m.lat!=null&&m.lng!=null&&!t.includes(String(m.id))&&(!m.atualizado_em||new Date(m.atualizado_em).getTime()>lim));
    l.forEach(m=>m.d=hav(me.lat,me.lng,m.lat,m.lng));l.sort((a,b)=>a.d-b.d);
    const m=l[0];
    if(!m){localStorage.setItem("auto","0");toast("Nenhum motoboy disponível agora");return}
    t.push(String(m.id));localStorage.setItem("tentados",JSON.stringify(t));
    const r=await api("corridas",{method:"POST",body:JSON.stringify({motoboy_id:m.id,cliente_nome:c.cliente_nome,cliente_tel:c.cliente_tel,destino_end:c.destino_end,destino_lat:c.destino_lat,destino_lng:c.destino_lng,distancia_km:c.distancia_km,valor:+(c.distancia_km*m.preco_km).toFixed(2),status:"pendente"})});
    localStorage.setItem("corrida_id",r[0].id);dest=null;toast("Procurando outro motoboy…");acompanhar();
  }catch(e){}finally{reenviando=false}
}
function ligarEstrelas(id){
  const ss=[...document.querySelectorAll("#stars span")];
  ss.forEach(s=>s.onclick=async()=>{
    const n=+s.dataset.n;ss.forEach(x=>{const on=+x.dataset.n<=n;x.style.filter=on?"none":"grayscale(1)";x.style.opacity=on?1:.5});
    try{await api("corridas?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({avaliacao:n}),prefer:"return=minimal"});toast("Obrigado pela avaliação ⭐")}
    catch(e){toast("Não foi possível enviar a nota")}
  });
}
function guardarHist(c){
  if(c.status!=="concluida")return;
  const h=JSON.parse(LS("hist")||"[]");if(h.some(x=>x.id===c.id))return;
  h.unshift({id:c.id,end:c.destino_end,valor:c.valor,km:c.distancia_km,data:c.atualizado_em||new Date().toISOString()});
  localStorage.setItem("hist",JSON.stringify(h.slice(0,20)));
}
function histHtml(){
  const h=JSON.parse(LS("hist")||"[]");if(!h.length)return"";
  return '<div class="sec">🧾 Minhas corridas</div>'+h.map(c=>`<div class="card"><div class="row"><b>${brl(c.valor)}</b><span class="k">${new Date(c.data).toLocaleDateString("pt-BR")}</span></div><div class="k">📍 ${esc(c.end)} · ${(+c.km).toFixed(1)} km</div></div>`).join("");
}
function start(){LS("corrida_id")?acompanhar():home()}
function vigiar(){
  navigator.geolocation.watchPosition(p=>{
    me.lat=p.coords.latitude;me.lng=p.coords.longitude;
    if(map&&layers.me){const ll=[me.lat,me.lng];layers.me.setLatLng(ll);layers.acc.setLatLng(ll).setRadius(Math.min(p.coords.accuracy||0,150))}
  },null,{enableHighAccuracy:true,maximumAge:5000});
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{me.lat=p.coords.latitude;me.lng=p.coords.longitude;start();vigiar()},()=>{toast("Ative a localização para ver motoboys perto de você");start()},{enableHighAccuracy:true,timeout:10000});
}else start();
</script>
